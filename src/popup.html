<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Postulo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/postulo-32.png" alt="" width="20" height="20" />
      <h1>Postulo</h1>
    </header>

    <section id="unconfigured" hidden>
      <p>Tell the extension where your Postulo is and which token to use.</p>
      <button id="open-options" type="button" class="primary">Set it up</button>
    </section>

    <section id="ready" hidden>
      <p id="target" class="muted"></p>
      <button id="capture" type="button" class="primary">Capture this posting</button>
      <p class="hint">The page you are looking at is sent to your Postulo and nowhere else.</p>
    </section>

    <section id="result" hidden>
      <p id="summary"></p>
      <p id="read-by" class="muted"></p>
      <a id="review" href="#" target="_blank" rel="noopener" class="primary button">Review in Postulo</a>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      <button id="options-link" type="button" class="link">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
