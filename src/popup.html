<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Postulo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/postulo-32.png" alt="" width="20" height="20" />
      <h1>Postulo</h1>
    </header>

    <section id="unconfigured" hidden>
      <p data-i18n="unconfigured">Tell the extension where your Postulo is and which token to use.</p>
      <button id="open-options" type="button" class="primary" data-i18n="setUp">Set it up</button>
    </section>

    <section id="ready" hidden>
      <button id="capture" type="button" class="primary" data-i18n="capture">Capture this posting</button>
      <p class="hint" data-i18n="captureHint">The page you are looking at is sent to your Postulo and nowhere else.</p>
    </section>

    <!-- What Postulo read, before anything is kept: the fields its review screen opens with,
         less the ones a person rarely needs to fix from the posting itself. -->
    <section id="edit" hidden>
      <p class="hint" data-i18n="reviewHint">This is what Postulo read from the page. Correct anything it got wrong before sending it.</p>
      <form id="posting">
        <label for="f-title" data-i18n="fieldTitle">Job title</label>
        <input id="f-title" name="title" maxlength="500" required />

        <div class="pair">
          <div>
            <label for="f-company" data-i18n="fieldCompany">Company</label>
            <input id="f-company" name="company_name" maxlength="500" />
          </div>
          <div>
            <label for="f-location" data-i18n="fieldLocation">Location</label>
            <input id="f-location" name="location" maxlength="500" />
          </div>
        </div>

        <div class="pair">
          <div>
            <label for="f-remote" data-i18n="fieldRemote">Working arrangement</label>
            <select id="f-remote" name="remote_type">
              <option value="">—</option>
              <option value="onsite" data-i18n="remoteOnsite">On site</option>
              <option value="hybrid" data-i18n="remoteHybrid">Hybrid</option>
              <option value="remote" data-i18n="remoteRemote">Remote</option>
            </select>
          </div>
          <div>
            <label for="f-employment" data-i18n="fieldEmployment">Employment type</label>
            <select id="f-employment" name="employment_type">
              <option value="">—</option>
              <option value="full_time" data-i18n="employmentFullTime">Full time</option>
              <option value="part_time" data-i18n="employmentPartTime">Part time</option>
              <option value="contract" data-i18n="employmentContract">Contract</option>
              <option value="freelance" data-i18n="employmentFreelance">Freelance</option>
              <option value="internship" data-i18n="employmentInternship">Internship</option>
              <option value="apprenticeship" data-i18n="employmentApprenticeship">Apprenticeship</option>
            </select>
          </div>
        </div>

        <div class="pair">
          <div>
            <label for="f-salary-min" data-i18n="fieldSalaryFrom">Salary from</label>
            <input id="f-salary-min" name="salary_min" type="number" min="0" step="any" inputmode="decimal" />
          </div>
          <div>
            <label for="f-salary-max" data-i18n="fieldSalaryTo">Salary to</label>
            <input id="f-salary-max" name="salary_max" type="number" min="0" step="any" inputmode="decimal" />
          </div>
        </div>

        <div class="pair">
          <div>
            <label for="f-currency" data-i18n="fieldCurrency">Currency</label>
            <input id="f-currency" name="salary_currency" maxlength="3" autocapitalize="characters" spellcheck="false" />
          </div>
          <div>
            <label for="f-period" data-i18n="fieldPeriod">Period</label>
            <select id="f-period" name="salary_period">
              <option value="">—</option>
              <option value="year" data-i18n="periodYear">Per year</option>
              <option value="month" data-i18n="periodMonth">Per month</option>
              <option value="day" data-i18n="periodDay">Per day</option>
              <option value="hour" data-i18n="periodHour">Per hour</option>
            </select>
          </div>
        </div>

        <label for="f-closes" data-i18n="fieldCloses">Closing date</label>
        <input id="f-closes" name="closes_at" type="date" />

        <details>
          <summary id="f-description-label" data-i18n="fieldDescription">Description</summary>
          <textarea id="f-description" name="description" rows="7" aria-labelledby="f-description-label"></textarea>
        </details>

        <div class="send">
          <button id="send" type="submit" class="primary" data-i18n="sendForReview">Send for review</button>
          <span id="edit-read-by" class="muted"></span>
        </div>
      </form>
    </section>

    <section id="result" hidden>
      <p id="summary"></p>
      <p id="read-by" class="muted"></p>
      <a id="review" href="#" target="_blank" rel="noopener" class="primary button" data-i18n="review">Review in Postulo</a>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      <a id="server" class="server" href="#" target="_blank" rel="noopener" hidden></a>
      <button id="options-link" type="button" class="icon" aria-label="Settings" title="Settings" data-i18n-label="settings">
        <!-- The core's settings icon, so the two look alike: lucide-static v1.41.0, ISC. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
