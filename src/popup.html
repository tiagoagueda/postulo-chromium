<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Postulo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/postulo-32.png" alt="" width="20" height="20" />
      <h1>Postulo</h1>
    </header>

    <section id="unconfigured" hidden>
      <p data-i18n="unconfigured">Tell the extension where your Postulo is and which token to use.</p>
      <button id="open-options" type="button" class="primary" data-i18n="setUp">Set it up</button>
    </section>

    <section id="ready" hidden>
      <button id="capture" type="button" class="primary" data-i18n="capture">Capture this posting</button>
      <p class="hint" data-i18n="captureHint">The page you are looking at is sent to your Postulo and nowhere else.</p>
    </section>

    <section id="result" hidden>
      <p id="summary"></p>
      <p id="read-by" class="muted"></p>
      <a id="review" href="#" target="_blank" rel="noopener" class="primary button" data-i18n="review">Review in Postulo</a>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      <a id="server" class="server" href="#" target="_blank" rel="noopener" hidden></a>
      <button id="options-link" type="button" class="icon" aria-label="Settings" title="Settings" data-i18n-label="settings">
        <!-- The core's settings icon, so the two look alike: lucide-static v1.41.0, ISC. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
