name: Bug report
about: Something in the extension does not work, or a posting was read wrongly.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Write in whatever language you can; English is easiest for the maintainer to act on, but a report in another language is better than none.

        **Is it a security problem?** Do not post it here, this page is public. Follow [SECURITY.md](https://source.tiagoagueda.com/postulo/postulo/src/branch/main/SECURITY.md).

        **Remove personal details before you paste anything.** Postulo holds CVs, home addresses and the names of the people somebody is applying to. A log or a screenshot is where those leak: blank out names, addresses, e-mail addresses, company and listing details, tokens and cookies first.

        The Firefox extension is built from this code, so a posting read wrongly in Firefox is reported here too. A problem with the Firefox package itself (installing, signing, permissions) belongs in [postulo-firefox](https://source.tiagoagueda.com/postulo/postulo-firefox/issues/new/choose).
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown on the browser's extensions page.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and its version
      placeholder: Chrome 142
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: postulo-version
    attributes:
      label: Postulo version it sends to
      description: The foot of every page shows the version. On the `:dev` image, give the pinned tag (`<version>-dev.<short sha>`), because `:dev` moves.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: job-board
    attributes:
      label: Which job board or kind of page
      description: The name of the site is enough. Do not paste the address; a posting's address can say where somebody is applying.
      placeholder: A company's own careers page
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did, step by step
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: If a posting was read wrongly, say which fields came out wrong (title, company, location, description, and so on).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If a posting was read wrongly, what each wrong field should have said. Text copied from the posting is better than a screenshot of the whole page.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "*Settings → Testing and troubleshooting → Download the log* saves what the extension did, without the token, the pages or what was read from them. **It does name the site of each page you captured and the address of your Postulo**: remove or replace those hosts before attaching it, or paste only the lines that bear on the problem."
      render: text
