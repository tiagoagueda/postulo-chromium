name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history: the translation guard reads every commit it is given.
          fetch-depth: 0
      - run: npm ci
      - name: Refuse translations written outside Weblate
        # Every translation is made at translate.tiagoagueda.com and comes back as Weblate's
        # pull request (postulo/postulo#706); a commit that writes one anywhere else fails.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/guard.mjs
      - name: Test the pure parts
        run: npm test
      - name: Build both targets
        run: npm run build
      - name: Lint the Firefox build with web-ext
        run: npx web-ext lint --source-dir dist/firefox
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: extension-packages
          path: dist/artifacts
